<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Velvet — Product UI System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<svg width="0" height="0"><defs>
  <linearGradient id="tabGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#7C3AED"/><stop offset="100%" stop-color="#EC4899"/>
  </linearGradient>
</defs></svg>

<div class="workspace">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="stage">
    <div class="stage-header">
      <div class="stage-eyebrow" id="stageEyebrow">DISCOVER</div>
      <div class="stage-title" id="stageTitle">Discover</div>
      <div class="stage-desc" id="stageDesc"></div>
    </div>
    <div class="phone">
      <div class="notch"></div>
      <div class="phone-screen" id="phoneScreen"></div>
    </div>
  </main>
</div>

<div class="mobile-menu-btn" id="mobileMenuBtn" onclick="toggleMobileSheet(true)">
  <svg width="20" height="20" viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
</div>
<div class="mobile-sheet" id="mobileSheet" onclick="if(event.target===this) toggleMobileSheet(false)">
  <div class="mobile-sheet-panel" id="mobileSheetPanel">
    <div class="mobile-sheet-handle"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
